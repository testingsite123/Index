<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Notepad</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --primary: #3b82f6;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    #doc-title {
      font-size: 1.1rem;
      font-weight: 600;
      border: 1px solid transparent;
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
      color: var(--text);
    }

    #doc-title:hover, #doc-title:focus {
      border-color: var(--border);
      background: var(--bg);
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 6px 14px;
      font-size: 0.875rem;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s ease;
    }

    button:hover { background: var(--bg); }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.primary:hover { opacity: 0.9; }

    main {
      flex: 1;
      display: flex;
    }

    #editor {
      width: 100%;
      height: 100%;
      padding: 24px;
      border: none;
      outline: none;
      resize: none;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
      background: var(--panel);
      font-family: inherit;
    }

    footer {
      display: flex;
      justify-content: space-between;
      padding: 8px 20px;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
  </style>
</head>
<body>

  <header>
    <input type="text" id="doc-title" value="Untitled Note" />
    <div class="btn-group">
      <button id="copy-btn">Copy</button>
      <button id="clear-btn">Clear</button>
      <button id="download-btn" class="primary">Download (.txt)</button>
    </div>
  </header>

  <main>
    <textarea id="editor" placeholder="Start typing your notes..."></textarea>
  </main>

  <footer>
    <div id="stats">Words: 0 | Characters: 0</div>
    <div id="save-status">Saved</div>
  </footer>

  <script>
    const editor = document.getElementById('editor');
    const titleInput = document.getElementById('doc-title');
    const stats = document.getElementById('stats');
    const saveStatus = document.getElementById('save-status');

    // Load saved content from localStorage
    editor.value = localStorage.getItem('notepad_text') || '';
    titleInput.value = localStorage.getItem('notepad_title') || 'Untitled Note';

    function updateStats() {
      const text = editor.value.trim();
      const words = text ? text.split(/\s+/).length : 0;
      const chars = editor.value.length;
      stats.textContent = `Words: ${words} | Characters: ${chars}`;
    }

    function save() {
      localStorage.setItem('notepad_text', editor.value);
      localStorage.setItem('notepad_title', titleInput.value);
      saveStatus.textContent = 'Saved';
    }

    editor.addEventListener('input', () => {
      saveStatus.textContent = 'Saving...';
      updateStats();
      save();
    });

    titleInput.addEventListener('input', save);

    document.getElementById('download-btn').addEventListener('click', () => {
      const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${titleInput.value.trim() || 'Note'}.txt`;
      link.click();
      URL.revokeObjectURL(link.href);
    });

    document.getElementById('copy-btn').addEventListener('click', async () => {
      await navigator.clipboard.writeText(editor.value);
      const originalText = document.getElementById('copy-btn').textContent;
      document.getElementById('copy-btn').textContent = 'Copied!';
      setTimeout(() => document.getElementById('copy-btn').textContent = originalText, 1500);
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      if (confirm('Clear note contents?')) {
        editor.value = '';
        updateStats();
        save();
      }
    });

    updateStats();
  </script>
</body>
</html>
