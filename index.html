<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Notepad</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --success: #16a34a;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 200px;
    }

    #doc-title {
      font-size: 1.1rem;
      font-weight: 600;
      border: 1px solid transparent;
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
      color: var(--text);
      width: 100%;
      max-width: 320px;
    }

    #doc-title:focus {
      border-color: var(--border);
      background: var(--bg);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      padding: 6px 14px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s ease;
    }

    button:hover { background: var(--bg); }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.primary:hover { opacity: 0.9; }

    main {
      flex: 1;
      display: flex;
    }

    #editor {
      width: 100%;
      height: 100%;
      padding: 20px;
      border: none;
      outline: none;
      resize: none;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
      background: var(--panel);
      font-family: inherit;
    }

    footer {
      display: flex;
      justify-content: space-between;
      padding: 8px 20px;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <input type="text" id="doc-title" value="Untitled Note" />
    </div>

    <div class="btn-group">
      <button id="cloud-save-btn" class="primary">☁️ Save Online</button>
      <button id="new-note-btn">+ New Note</button>
      <button id="copy-share-btn">🔗 Share Link</button>
      <button id="download-btn">Download (.txt)</button>
    </div>
  </header>

  <main>
    <textarea id="editor" placeholder="Start typing your note here..."></textarea>
  </main>

  <footer>
    <div id="stats">Words: 0 | Characters: 0</div>
    <div id="status">Ready</div>
  </footer>

  <script>
    const editor = document.getElementById('editor');
    const titleInput = document.getElementById('doc-title');
    const stats = document.getElementById('stats');
    const statusText = document.getElementById('status');

    // Public key-value namespace
    const API_BASE = 'https://kvdb.io/An9YVf4K4Qk8p7B5m1WvQe/';
    
    // Check if a note ID is in the URL hash (#note_...)
    let noteId = window.location.hash.replace('#', '');

    function updateStats() {
      const text = editor.value.trim();
      const words = text ? text.split(/\s+/).length : 0;
      stats.textContent = `Words: ${words} | Characters: ${editor.value.length}`;
    }

    function autoSaveLocal() {
      if (!noteId) {
        localStorage.setItem('local_draft_text', editor.value);
        localStorage.setItem('local_draft_title', titleInput.value);
      }
    }

    // Load note from cloud
    async function loadFromCloud(id) {
      statusText.textContent = 'Fetching note from cloud...';
      try {
        const res = await fetch(`${API_BASE}${id}`);
        if (!res.ok) throw new Error('Note not found or expired');
        
        const data = await res.json();
        editor.value = data.content || '';
        titleInput.value = data.title || 'Untitled Note';
        statusText.textContent = 'Cloud note loaded';
        updateStats();
      } catch (err) {
        statusText.textContent = `Load failed: ${err.message}`;
      }
    }

    // Save note to cloud
    async function saveToCloud() {
      statusText.textContent = 'Saving online...';

      if (!noteId) {
        noteId = 'note_' + Math.random().toString(36).substring(2, 10);
        window.location.hash = noteId;
      }

      const payload = {
        title: titleInput.value,
        content: editor.value,
        updatedAt: new Date().toISOString()
      };

      try {
        const res = await fetch(`${API_BASE}${noteId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error('Cloud server rejected save');

        statusText.textContent = 'Saved online!';
        setTimeout(() => { statusText.textContent = 'Ready'; }, 2000);
      } catch (err) {
        statusText.textContent = `Save failed: ${err.message}`;
      }
    }

    // UI Listeners
    editor.addEventListener('input', () => {
      updateStats();
      autoSaveLocal();
    });

    titleInput.addEventListener('input', autoSaveLocal);

    document.getElementById('cloud-save-btn').addEventListener('click', saveToCloud);

    document.getElementById('copy-share-btn').addEventListener('click', async () => {
      if (!noteId) {
        await saveToCloud();
      }
      await navigator.clipboard.writeText(window.location.href);
      const originalText = document.getElementById('copy-share-btn').textContent;
      document.getElementById('copy-share-btn').textContent = 'Copied!';
      setTimeout(() => {
        document.getElementById('copy-share-btn').textContent = originalText;
      }, 1500);
    });

    document.getElementById('new-note-btn').addEventListener('click', () => {
      noteId = '';
      window.location.hash = '';
      editor.value = '';
      titleInput.value = 'Untitled Note';
      updateStats();
      statusText.textContent = 'New note started';
    });

    document.getElementById('download-btn').addEventListener('click', () => {
      const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${titleInput.value.trim() || 'note'}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // Boot Initialization
    if (noteId) {
      loadFromCloud(noteId);
    } else {
      editor.value = localStorage.getItem('local_draft_text') || '';
      titleInput.value = localStorage.getItem('local_draft_title') || 'Untitled Note';
      updateStats();
    }
  </script>
</body>
</html>
