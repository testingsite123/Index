<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Notepad</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --success: #16a34a;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 240px;
    }

    #doc-title {
      font-size: 1.1rem;
      font-weight: 600;
      border: 1px solid transparent;
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
      color: var(--text);
      width: 100%;
      max-width: 320px;
    }

    #doc-title:focus {
      border-color: var(--border);
      background: var(--bg);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      padding: 6px 12px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    button:hover { background: var(--bg); }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.primary:hover { opacity: 0.9; }

    /* Configuration bar */
    #config-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 20px;
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
    }

    #config-bar input {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.8rem;
      width: 250px;
    }

    main {
      flex: 1;
      display: flex;
    }

    #editor {
      width: 100%;
      height: 100%;
      padding: 20px;
      border: none;
      outline: none;
      resize: none;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
      background: var(--panel);
      font-family: inherit;
    }

    footer {
      display: flex;
      justify-content: space-between;
      padding: 8px 20px;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <input type="text" id="doc-title" value="Untitled Note" />
    </div>

    <div class="btn-group">
      <button id="cloud-save-btn" class="primary">☁️ Save Online</button>
      <button id="copy-share-btn">🔗 Share Link</button>
      <button id="download-btn">Download (.txt)</button>
    </div>
  </header>

  <!-- Cloud API Settings -->
  <div id="config-bar">
    <label for="api-key"><strong>JSONBin Access Key:</strong></label>
    <input type="password" id="api-key" placeholder="Paste Master Key ($2a$10$...)" />
    <span style="color: var(--muted);">(Free key from jsonbin.io required for private cloud saves)</span>
  </div>

  <main>
    <textarea id="editor" placeholder="Type here..."></textarea>
  </main>

  <footer>
    <div id="stats">Words: 0 | Characters: 0</div>
    <div id="status">Ready</div>
  </footer>

  <script>
    const editor = document.getElementById('editor');
    const titleInput = document.getElementById('doc-title');
    const stats = document.getElementById('stats');
    const statusText = document.getElementById('status');
    const apiKeyInput = document.getElementById('api-key');

    // Check for note ID in URL query params
    const urlParams = new URLSearchParams(window.location.search);
    let binId = urlParams.get('id') || localStorage.getItem('active_bin_id');

    // Restore API Key
    apiKeyInput.value = localStorage.getItem('jsonbin_key') || '';
    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('jsonbin_key', apiKeyInput.value.trim());
    });

    // Local autosave fallback
    function updateStats() {
      const text = editor.value.trim();
      const words = text ? text.split(/\s+/).length : 0;
      stats.textContent = `Words: ${words} | Characters: ${editor.value.length}`;
    }

    editor.addEventListener('input', () => {
      updateStats();
      localStorage.setItem('local_draft_text', editor.value);
      localStorage.setItem('local_draft_title', titleInput.value);
    });

    // Load Note from Cloud
    async function loadFromCloud(id) {
      const key = apiKeyInput.value.trim();
      statusText.textContent = 'Fetching note from cloud...';

      try {
        const headers = key ? { 'X-Master-Key': key } : {};
        const res = await fetch(`https://api.jsonbin.io/v3/b/${id}/latest`, { headers });
        if (!res.ok) throw new Error('Cloud note not found');

        const data = await res.json();
        editor.value = data.record.content || '';
        titleInput.value = data.record.title || 'Untitled Note';
        statusText.textContent = 'Loaded from cloud';
        updateStats();
      } catch (err) {
        statusText.textContent = `Load failed: ${err.message}`;
      }
    }

    // Save Note to Cloud (Create or Update)
    async function saveToCloud() {
      const key = apiKeyInput.value.trim();
      if (!key) {
        alert('Please enter your JSONBin Access Key in the bar above.\nSign up free at jsonbin.io to obtain your Master Key.');
        return;
      }

      statusText.textContent = 'Saving to cloud...';
      const payload = {
        title: titleInput.value,
        content: editor.value,
        updatedAt: new Date().toISOString()
      };

      try {
        let res;
        if (binId) {
          // Update existing bin
          res = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': key
            },
            body: JSON.stringify(payload)
          });
        } else {
          // Create new bin
          res = await fetch('https://api.jsonbin.io/v3/b', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': key,
              'X-Bin-Private': 'true',
              'X-Bin-Name': titleInput.value || 'Notepad Entry'
            },
            body: JSON.stringify(payload)
          });
        }

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Error saving');

        if (!binId && data.metadata && data.metadata.id) {
          binId = data.metadata.id;
          localStorage.setItem('active_bin_id', binId);
          const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?id=${binId}`;
          window.history.replaceState({ path: newUrl }, '', newUrl);
        }

        statusText.textContent = 'Cloud synced successfully!';
      } catch (err) {
        statusText.textContent = `Cloud save failed: ${err.message}`;
      }
    }

    document.getElementById('cloud-save-btn').addEventListener('click', saveToCloud);

    document.getElementById('copy-share-btn').addEventListener('click', async () => {
      if (!binId) {
        alert('Please save the note online first to generate a cloud link.');
        return;
      }
      await navigator.clipboard.writeText(window.location.href);
      alert('Note link copied to clipboard!');
    });

    document.getElementById('download-btn').addEventListener('click', () => {
      const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${titleInput.value || 'note'}.txt`;
      a.click();
    });

    // Initial boot logic
    if (binId) {
      loadFromCloud(binId);
    } else {
      editor.value = localStorage.getItem('local_draft_text') || '';
      titleInput.value = localStorage.getItem('local_draft_title') || 'Untitled Note';
      updateStats();
    }
  </script>
</body>
</html>
