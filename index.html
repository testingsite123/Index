<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mobile Cam & BG Color Changer</title>
  
  <!-- MediaPipe Selfie Segmentation & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 0.75rem) 0.75rem calc(env(safe-area-inset-bottom, 0.75rem) + 85px) 0.75rem;
    }

    header {
      text-align: center;
      padding: 0.5rem 0;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .main-content {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      flex: 1;
    }

    .video-card {
      background: #1e293b;
      border-radius: 14px;
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.2rem;
    }

    .card-header span {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    /* Processed live output canvas */
    canvas#outputCanvas {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #020617;
      border-radius: 10px;
      object-fit: cover;
    }

    video#recordedPlayback {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #020617;
      border-radius: 10px;
      object-fit: cover;
    }

    /* Hidden raw camera element */
    #rawVideo {
      display: none;
    }

    /* Color Selection Bar */
    .bg-controls {
      background: #1e293b;
      border-radius: 14px;
      padding: 0.65rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .bg-controls-title {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }

    .palette {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .swatch {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .swatch.active {
      border-color: #38bdf8;
      transform: scale(1.15);
    }

    .custom-color-wrapper {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px dashed #475569;
    }

    .custom-color-wrapper input[type="color"] {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      cursor: pointer;
      border: none;
    }

    .status-bar {
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      min-height: 1.5rem;
    }

    .recording-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Fixed thumb-accessible bottom action bar */
    .action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.6rem 0.75rem calc(env(safe-area-inset-bottom, 0.6rem) + 0.2rem);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      max-width: 480px;
      margin: 0 auto;
      border-top: 1px solid #334155;
      z-index: 100;
    }

    button.btn {
      touch-action: manipulation;
      min-height: 46px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    button.btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    button.btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-camera { background: #2563eb; color: #fff; }
    .btn-record { background: #ef4444; color: #fff; }
    .btn-stop { background: #475569; color: #fff; }
    .btn-save { background: #10b981; color: #fff; grid-column: span 2; }
  </style>
</head>
<body>

  <header>
    <h1>AI Background Changer & Recorder</h1>
  </header>

  <!-- Raw hidden video element for MediaPipe input -->
  <video id="rawVideo" playsinline webkit-playsinline muted></video>

  <div class="main-content">
    <!-- Live Canvas (Output) -->
    <div class="video-card">
      <div class="card-header">
        <span>Processed Live Preview</span>
      </div>
      <canvas id="outputCanvas" width="640" height="480"></canvas>
    </div>

    <!-- Background Color Chooser -->
    <div class="bg-controls">
      <div class="bg-controls-title">Pick Background Color</div>
      <div class="palette">
        <!-- 'original' restores raw camera stream without solid color replacement -->
        <button class="swatch active" data-color="original" style="background: linear-gradient(135deg, #475569 50%, #1e293b 50%);" title="Original"></button>
        <button class="swatch" data-color="#00FF00" style="background: #00FF00;" title="Green Screen"></button>
        <button class="swatch" data-color="#0066FF" style="background: #0066FF;" title="Blue Screen"></button>
        <button class="swatch" data-color="#111827" style="background: #111827;" title="Matte Black"></button>
        <button class="swatch" data-color="#F3F4F6" style="background: #F3F4F6;" title="Clean White"></button>
        <button class="swatch" data-color="#7C3AED" style="background: #7C3AED;" title="Studio Purple"></button>
        <div class="custom-color-wrapper" title="Pick Custom Color">
          <input type="color" id="customColorPicker" value="#FF5733">
        </div>
      </div>
    </div>

    <!-- Recorded Preview -->
    <div class="video-card">
      <div class="card-header">
        <span>Recorded Video Preview</span>
      </div>
      <video id="recordedPlayback" playsinline webkit-playsinline controls></video>
    </div>

    <div id="statusText" class="status-bar">Tap "Enable Camera" to load AI segmentation</div>
  </div>

  <!-- Bottom Thumb Actions -->
  <div class="action-bar">
    <button id="cameraBtn" class="btn btn-camera">Enable Camera</button>
    <button id="recordBtn" class="btn btn-record" disabled>Record</button>
    <button id="stopBtn" class="btn btn-stop" disabled>Stop</button>
    <button id="downloadBtn" class="btn btn-save" disabled>Save Recording</button>
  </div>

  <script>
    const rawVideo = document.getElementById('rawVideo');
    const outputCanvas = document.getElementById('outputCanvas');
    const ctx = outputCanvas.getContext('2d');
    const recordedPlayback = document.getElementById('recordedPlayback');
    const cameraBtn = document.getElementById('cameraBtn');
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusText = document.getElementById('statusText');
    const customColorPicker = document.getElementById('customColorPicker');
    const swatches = document.querySelectorAll('.swatch');

    let stream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let activeBgColor = 'original';
    let chosenMimeType = '';

    // Color Swatch Selection
    swatches.forEach(swatch => {
      swatch.addEventListener('click', () => {
        swatches.forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        activeBgColor = swatch.getAttribute('data-color');
      });
    });

    customColorPicker.addEventListener('input', (e) => {
      swatches.forEach(s => s.classList.remove('active'));
      activeBgColor = e.target.value;
    });

    // 1. Initialize MediaPipe SelfieSegmentation
    const selfieSegmentation = new SelfieSegmentation({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });

    selfieSegmentation.setOptions({
      modelSelection: 1 // 0: general, 1: landscape/selfie (optimized for real-time mobile inference)
    });

    // 2. Render Results onto Canvas
    selfieSegmentation.onResults((results) => {
      ctx.save();
      ctx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);

      // Mirror horizontally for selfie orientation
      ctx.translate(outputCanvas.width, 0);
      ctx.scale(-1, 1);

      if (activeBgColor === 'original') {
        // Draw original video feed directly
        ctx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
      } else {
        // Draw segmentation mask
        ctx.drawImage(results.segmentationMask, 0, 0, outputCanvas.width, outputCanvas.height);

        // Keep only overlapping pixels with the video feed (the person)
        ctx.globalCompositeOperation = 'source-in';
        ctx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);

        // Draw solid background underneath the person
        ctx.globalCompositeOperation = 'destination-over';
        ctx.fillStyle = activeBgColor;
        ctx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
      }

      ctx.restore();
    });

    // 3. Enable Camera & Camera Pipeline
    cameraBtn.addEventListener('click', async () => {
      try {
        statusText.textContent = 'Starting camera & downloading AI model...';

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: true
        });

        rawVideo.srcObject = stream;
        await rawVideo.play();

        // Feed raw frames through MediaPipe
        const cameraFeed = new Camera(rawVideo, {
          onFrame: async () => {
            await selfieSegmentation.send({ image: rawVideo });
          },
          width: 640,
          height: 480
        });

        await cameraFeed.start();

        cameraBtn.disabled = true;
        recordBtn.disabled = false;
        statusText.textContent = 'AI ready. Pick a background color.';
      } catch (err) {
        console.error(err);
        statusText.textContent = 'Failed to load camera or AI model.';
      }
    });

    // 4. Determine Safe Codec
    function getSupportedMimeType() {
      const candidateTypes = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm',
        'video/mp4;codecs=avc1,mp4a.40.2',
        'video/mp4'
      ];
      return candidateTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';
    }

    // 5. Start Recording (Canvas stream + Mic Audio)
    recordBtn.addEventListener('click', () => {
      recordedChunks = [];
      chosenMimeType = getSupportedMimeType();

      // Capture processed stream directly from Canvas at 30 FPS
      const canvasStream = outputCanvas.captureStream(30);

      // Extract microphone audio track from the original webcam stream
      const audioTrack = stream.getAudioTracks()[0];
      if (audioTrack) {
        canvasStream.addTrack(audioTrack);
      }

      try {
        mediaRecorder = new MediaRecorder(canvasStream, chosenMimeType ? { mimeType: chosenMimeType } : undefined);
      } catch (err) {
        mediaRecorder = new MediaRecorder(canvasStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const fileExt = chosenMimeType.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(recordedChunks, { type: chosenMimeType || 'video/webm' });
        const videoUrl = URL.createObjectURL(blob);

        recordedPlayback.src = videoUrl;
        downloadBtn.disabled = false;
        recordBtn.disabled = false;
        stopBtn.disabled = true;
        statusText.textContent = 'Ready to preview or save.';

        downloadBtn.onclick = () => {
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = videoUrl;
          a.download = `segmented-recording-${Date.now()}.${fileExt}`;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => document.body.removeChild(a), 100);
        };
      };

      mediaRecorder.start(500);
      recordBtn.disabled = true;
      stopBtn.disabled = false;
      downloadBtn.disabled = true;
      statusText.innerHTML = '<span class="recording-dot"></span> Recording with custom background...';
    });

    // 6. Stop Recording
    stopBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    });
  </script>
</body>
</html>
