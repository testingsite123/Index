<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webcam Recorder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 768px) {
      .video-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .video-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .video-card h2 {
      font-size: 1rem;
      margin-bottom: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #020617;
      border-radius: 8px;
      object-fit: cover;
    }

    /* Flip preview mirror-style */
    #liveFeed {
      transform: scaleX(-1);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      background: #1e293b;
      padding: 1rem;
      border-radius: 12px;
    }

    button {
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-start {
      background: #2563eb;
      color: #fff;
    }
    .btn-start:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .btn-record {
      background: #ef4444;
      color: #fff;
    }
    .btn-record:hover:not(:disabled) {
      background: #dc2626;
    }

    .btn-stop {
      background: #475569;
      color: #fff;
    }
    .btn-stop:hover:not(:disabled) {
      background: #334155;
    }

    .btn-download {
      background: #10b981;
      color: #fff;
    }
    .btn-download:hover:not(:disabled) {
      background: #059669;
    }

    .status {
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
      min-height: 1.2rem;
    }

    .recording-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1s infinite;
      margin-right: 6px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Webcam Stream & Recorder</h1>

    <div class="video-grid">
      <div class="video-card">
        <h2>Live Preview</h2>
        <video id="liveFeed" autoplay playsinline muted></video>
      </div>

      <div class="video-card">
        <h2>Recorded Video</h2>
        <video id="recordedPlayback" controls></video>
      </div>
    </div>

    <div class="controls">
      <button id="cameraBtn" class="btn-start">Enable Camera</button>
      <button id="recordBtn" class="btn-record" disabled>Start Recording</button>
      <button id="stopBtn" class="btn-stop" disabled>Stop Recording</button>
      <button id="downloadBtn" class="btn-download" disabled>Download</button>
    </div>

    <div id="statusText" class="status">Camera is off. Click "Enable Camera" to begin.</div>
  </div>

  <script>
    const liveFeed = document.getElementById('liveFeed');
    const recordedPlayback = document.getElementById('recordedPlayback');
    const cameraBtn = document.getElementById('cameraBtn');
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusText = document.getElementById('statusText');

    let stream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordedBlob = null;

    // 1. Enable Camera & Mic
    cameraBtn.addEventListener('click', async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });

        liveFeed.srcObject = stream;
        cameraBtn.disabled = true;
        recordBtn.disabled = false;
        statusText.textContent = 'Camera active. Ready to record.';
      } catch (err) {
        console.error('Camera access error:', err);
        statusText.textContent = `Error: ${err.message || 'Could not access camera/microphone.'}`;
      }
    });

    // 2. Start Recording
    recordBtn.addEventListener('click', () => {
      recordedChunks = [];

      // Determine supported MIME type
      const mimeType = MediaRecorder.isTypeSupported('video/webm; codecs=vp9,opus')
        ? 'video/webm; codecs=vp9,opus'
        : 'video/webm';

      mediaRecorder = new MediaRecorder(stream, { mimeType });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        recordedBlob = new Blob(recordedChunks, { type: 'video/webm' });
        const videoUrl = URL.createObjectURL(recordedBlob);
        recordedPlayback.src = videoUrl;
        downloadBtn.disabled = false;
        recordBtn.disabled = false;
        stopBtn.disabled = true;
        statusText.innerHTML = 'Recording finished. Ready for preview or download.';
      };

      mediaRecorder.start();
      recordBtn.disabled = true;
      stopBtn.disabled = false;
      downloadBtn.disabled = true;
      statusText.innerHTML = '<span class="recording-indicator"></span> Recording in progress...';
    });

    // 3. Stop Recording
    stopBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    });

    // 4. Download Saved File
    downloadBtn.addEventListener('click', () => {
      if (!recordedBlob) return;
      const url = URL.createObjectURL(recordedBlob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = `recording-${Date.now()}.webm`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 100);
    });
  </script>
</body>
</html>
